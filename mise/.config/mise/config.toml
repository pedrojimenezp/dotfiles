# `mise use -g` edits this file through the link: commit the change.

[tools]
node = "lts"
go = "latest"

# --- Editor and terminal ---
neovim = "latest"
tmux = "latest"  # tmux.conf needs 3.7+, newer than apt ships
starship = "latest"  # indirect

# --- Shell productivity ---
fzf = "latest"  # indirect
zoxide = "latest"
eza = "latest"
bat = "latest"
ripgrep = "latest"  # indirect
fd = "latest"  # indirect
jq = "latest"
yq = "latest"
btop = { version = "latest", os = ["linux"] }  # no macOS build; the Brewfile has it
tealdeer = "latest"
hyperfine = "latest"

# --- Git and containers ---
delta = "latest"  # indirect
lazygit = "latest"
lazydocker = "latest"
gh = "latest"
git-lfs = "latest"  # indirect: the git config requires it

# --- Languages and dev tools ---
zig = "0.17.0"
zls = "0.17.0"  # indirect: must match zig
shellcheck = "latest"  # indirect
shfmt = "latest"  # indirect
tree-sitter = "latest"  # indirect: nvim-treesitter (main) compiles parsers with it
golangci-lint = "latest"  # indirect

# --- Markdown ---
mermaid-ascii = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]  # also .nvmrc, .node-version
