# tmux >= 3.7 (mise installs it; run mise up tmux on older machines)

# --- Prefix: Ctrl+Space ---
unbind C-b
set -g prefix C-Space
bind -N "send Ctrl+Space to the program inside (nested tmux)" C-Space send-prefix

# --- Terminal and colors ---
# The default only where the tmux-256color terminfo entry exists, else "screen"
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Shift+Enter, Ctrl+Enter reach apps (Claude Code) as CSI u
set -s extended-keys on
set -s extended-keys-format csi-u
# Outer terminal supports extended keys (xterm-256color, xterm-ghostty)
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
# theme recolors the outer terminal; chafa draws images
set -g allow-passthrough on

# --- General behavior ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 1500
# tmux picks vi keys only when $EDITOR contains "vi"
set -g mode-keys vi
set -g status-keys vi

# --- Clipboard (OSC 52, works over SSH) ---
set -g set-clipboard on

# --- Copy mode (vi style) ---
bind -N "start a selection" -T copy-mode-vi v send -X begin-selection
bind -N "copy the selection and leave copy mode" -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Splits and windows ---
bind -N "split left/right in the current folder" | split-window -h -c "#{pane_current_path}"
bind -N "split top/bottom in the current folder" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -N "new window in the current folder" c new-window -c "#{pane_current_path}"

# --- Resize panes ---
bind -N "resize pane left by 5 cells (repeatable)" -r H resize-pane -L 5
bind -N "resize pane down by 5 cells (repeatable)" -r J resize-pane -D 5
bind -N "resize pane up by 5 cells (repeatable)" -r K resize-pane -U 5
bind -N "resize pane right by 5 cells (repeatable)" -r L resize-pane -R 5

# --- Misc bindings ---
bind -N "kill the current session (asks first)" X confirm-before -p "kill session #S? (y/n)" kill-session
bind -N "reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind -N "project session picker" f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"
# Quotes keep the tty path one argument
bind -N "toggle light/dark theme" t run-shell "~/.local/bin/theme toggle --tty '#{client_tty}'"
bind -N "search all shortcuts (this help)" ? display-popup -E -w 80% -h 80% -T " help " "~/.local/bin/dotfiles-help"

# --- Zen mode ---
# Column width of zen mode; local.conf can override it
set -g @zen_width 120
bind -N "zen mode: center the window in a column (@zen_width) with empty side panes" Z run-shell "~/.local/bin/tmux-zen toggle #{q:window_id}"
bind -N "three columns: add a shell pane on each side, the center keeps @zen_width" T run-shell "~/.local/bin/tmux-zen columns #{q:window_id}"

# --- Popups ---
bind -N "lazygit popup in the pane's folder" G if-shell "command -v lazygit >/dev/null 2>&1" {
  display-popup -E -w 90% -h 90% "~/.local/bin/tmux-lazygit #{q:pane_current_path}"
} {
  display-message "lazygit is not installed"
}
# Errors from review show as a message
bind -N "review changes in nvim diffview, one window per repo" R run-shell "if [ -x ~/.local/bin/review ]; then ~/.local/bin/review #{q:pane_current_path} 2>&1 >/dev/null | tail -1 | xargs -I{} tmux display-message -- {}; else tmux display-message 'review: not installed (run install.sh)'; fi"
# Inside any popup, the key closes it
bind -N "toggle the scratch shell popup" ` if-shell -F "#{m:_popup_*,#{session_name}}" detach-client {
  run-shell "~/.local/bin/tmux-popup open shell #{q:client_name} #{q:session_id} #{q:pane_current_path}"
}
bind -N "toggle the Claude Code popup" A if-shell -F "#{m:_popup_*,#{session_name}}" detach-client {
  run-shell "~/.local/bin/tmux-popup open claude #{q:client_name} #{q:session_id} #{q:pane_current_path}"
}
# -G: without it, tmux 3.7 lists no sessions while a session group exists (s and w)
bind -N "pick a session, sorted by name (popup sessions hidden)" s choose-tree -GZs -O name -f "#{?#{m:_popup_*,#{session_name}},0,1}"
bind -N "pick a window, sessions sorted by name (popup sessions hidden)" w choose-tree -GZw -O name -f "#{?#{m:_popup_*,#{session_name}},0,1}"
# The defaults would land in hidden popup sessions
bind -N "previous session (skips popup sessions)" ( run-shell "~/.local/bin/tmux-popup prev #{q:client_name}"
bind -N "next session (skips popup sessions)" ) run-shell "~/.local/bin/tmux-popup next #{q:client_name}"
set-hook -g session-closed 'run-shell "~/.local/bin/tmux-popup cleanup"'
# detach-on-destroy off may move a client into a popup session
set-hook -g client-session-changed {
  if-shell -F "#{m:_popup_*,#{session_name}}" {
    run-shell "~/.local/bin/tmux-popup rescue #{q:client_name}"
  }
}
# --- Status line: palette names so it follows the theme ---
set -g status-interval 5
set -g status-style "bg=default,fg=default"
# `theme` writes a softly tinted bar color here; without the file the bar keeps the terminal bg
source-file -q ~/.local/state/theme-tmux.conf
# Read when the server starts; local.conf can override it
set -g @host_label "$HOST_LABEL"
# Blue, yellow while the prefix is pressed
set -g @session_block "#{?client_prefix,#[fg=yellow],#[fg=blue]}#[bold,reverse] #S #[default] "
set -g @user_block "#[fg=magenta,bold,reverse] #{user} #[default]"
set -g status-left "#{E:@user_block}#{E:@session_block}"
set -g status-left-length 80
# brightblack is too faint on light themes, so host and time use the default fg
# Empty over SSH, where the left badge shows the host
set -g @host_block "#h "
set -g status-right '#(cd #{q:pane_current_path} 2>/dev/null && b=$(git branch --show-current 2>/dev/null) && [ -n "$b" ] && echo "  $b ")#{E:@host_block}#[bold]%H:%M '
set -g status-right-length 80
# Over SSH, a red badge so it never passes for the local tmux. if-shell sees the SSH_CONNECTION
# of the shell that started the server, so a server started locally keeps the local look.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g status-left "#[fg=red,bold,reverse] 󰣀 SSH #{user}@#{?@host_label,#{@host_label},#{host_short}} #[default]#{E:@session_block}"
  set -g @host_block ""
}
# monitor-activity stays off: it flags every window that prints
# Claude Code rings when it needs you
set -g window-status-bell-style "fg=yellow,bold,reverse"
# Below this width, only the account's first letter
set -g @claude_label_min_width 120
# Spaces, not commas, in style changes so they fit the conditional
set -g @claude_window_label "#{P:#{?#{@claude_account}, #[fg=magenta]●#{?#{e|<:#{client_width},#{@claude_label_min_width}},#{=1:@claude_account},#{@claude_account}}#[fg=default],}}"
# No dim: unreadable on some palettes
set -g window-status-format " #I:#W#{?window_bell_flag, 🔔,}#{?window_zoomed_flag, 🔍,}#{E:@claude_window_label} "
# reverse contrasts with the bar in any theme
set -g window-status-current-format "#[fg=default,bold,reverse] #I:#W#{?window_zoomed_flag, 🔍,} "
# A version-like name (2.1.312) is Claude Code
set -g @pane_program "#{?#{m/r:^[0-9]+\\.[0-9]+,#{pane_current_command}},claude,#{pane_current_command}}"
set -g automatic-rename-format "#{E:@pane_program}"
# Heavy, so the divider stands apart from lines apps draw
set -g pane-border-lines heavy
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
# The default colors only half of a shared border
set -g pane-border-indicators arrows
set -g pane-border-format "#{?pane_active,#[fg=blue#,bold#,reverse],#[fg=default]} #{pane_index}: #{E:@pane_program} #[default]#{?#{@claude_account}, #[fg=magenta]●#{@claude_account}#[default],}"
# Pane labels only with 2+ panes; zen windows keep their own border settings
set-hook -g window-layout-changed[0] 'if -F "#{@zen}" "" "if -F \"#{>:#{window_panes},1}\" \"set -w pane-border-status top\" \"set -w pane-border-status off\""'
# A zen window with only pads left closes
set-hook -g window-layout-changed[1] 'if -F "#{@zen}" "run-shell \"~/.local/bin/tmux-zen cleanup #{q:window_id}\""'
# Zen: pads follow the window size and never keep focus (keys, clicks, closed panes)
set-hook -g window-resized 'if -F "#{@zen}" "run-shell \"~/.local/bin/tmux-zen fit #{q:window_id}\""'
set-hook -g window-pane-changed 'if -F "#{@zen}" "run-shell \"~/.local/bin/tmux-zen unpad #{q:window_id}\""'
set -g mode-style "reverse"
# fill=blue paints the whole line, not just the text
set -g message-style "bg=default,fg=blue,bold,reverse,fill=blue"
set -g message-command-style "bg=default,fg=blue,bold,reverse,fill=blue"
# tmux 3.8's solid grey popup is unreadable on light themes
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=blue"
set -g popup-border-lines rounded

# --- Ctrl-h/j/k/l: vim-tmux-navigator's bindings, inlined (the plugin was slow to reload) ---
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Plain Ctrl-l moves panes, so clearing needs the prefix (Cmd-K sends it). Skipped in vim, where
# Ctrl-l would move focus. Scrollback clears 0.3s later, after the shell redraw refills it.
bind -N "clear the screen and the scrollback (does nothing in vim/nvim)" C-l if -F "#{m/r:^(n?vim|vi)$,#{pane_current_command}}" "" {
  send-keys C-l
  run-shell -d 0.3 "tmux clear-history -t '#{pane_id}'"
}

# --- Plugins ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @resurrect-capture-pane-contents "on"
# A plain name restores the full saved command (ssh host)
set -g @resurrect-processes "ssh"
# Last: it prepends to status-right
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"
# Restored popup sessions lose their parent mark; restored windows keep their saved size
set -g @resurrect-hook-post-restore-all "~/.local/bin/tmux-popup cleanup; ~/.local/bin/tmux-fit-windows"
set -g @continuum-save-interval "15"

# Per-machine overrides: after the plugin options so they win, before TPM so it sees any @plugin they add
source-file -q ~/.config/tmux/local.conf

# -b: plugins would block the server for seconds. Bindings that override plugin keys go after it.
run -b "~/.config/tmux/plugins/tpm/tpm"
