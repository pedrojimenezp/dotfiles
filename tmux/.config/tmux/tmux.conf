# ~/.config/tmux/tmux.conf (tmux >= 3.3). Comments sit above each line.

# --- Prefix: Ctrl+Space ---
# Remove the default prefix (Ctrl-b)
unbind C-b
# Make Ctrl-Space the prefix
set -g prefix C-Space
# Pressing prefix twice sends Ctrl-Space to the app inside (e.g. for nested tmux)
bind C-Space send-prefix

# --- Terminal and colors ---
# Terminal type inside tmux
set -g default-terminal "tmux-256color"
# Advertise true color (RGB) for any outer terminal
set -as terminal-features ",*:RGB"
# Let apps (nvim) get focus-in/out events
set -g focus-events on
# Almost no delay after Esc (important for vim)
set -sg escape-time 10
# Allow OSC 52 clipboard and passthrough sequences from apps
set -g allow-passthrough on

# --- General behavior ---
# Mouse: click panes, resize, scroll
set -g mouse on
# Lines of scrollback per pane
set -g history-limit 50000
# Windows start at 1 (matches the keyboard row)
set -g base-index 1
# Panes start at 1 too
setw -g pane-base-index 1
# Renumber windows when one closes
set -g renumber-windows on
# Show messages for 1.5 seconds
set -g display-time 1500
# Use vi keys in copy mode and in the command prompt
set -g mode-keys vi
set -g status-keys vi

# --- Clipboard (OSC 52: also works over SSH) ---
# Let tmux and apps set the terminal's clipboard
set -g set-clipboard on

# --- Copy mode (vi style) ---
# v starts a selection
bind -T copy-mode-vi v send -X begin-selection
# y copies the selection and leaves copy mode
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Ctrl-v toggles rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# --- Splits and windows (open in the current directory) ---
# | splits left/right
bind | split-window -h -c "#{pane_current_path}"
# - splits top/bottom
bind - split-window -v -c "#{pane_current_path}"
# Free the default split keys
unbind '"'
unbind %
# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# --- Resize panes (repeatable: hold the key after the prefix) ---
# prefix + H resizes left by 5 cells
bind -r H resize-pane -L 5
# prefix + J resizes down
bind -r J resize-pane -D 5
# prefix + K resizes up
bind -r K resize-pane -U 5
# prefix + L resizes right
bind -r L resize-pane -R 5

# --- Misc bindings ---
# prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# prefix + f opens the project session picker (fzf popup, see bin/.local/bin/tmux-sessionizer)
bind f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"

# --- Status line (hand-written, minimal; colors match tokyonight) ---
# Refresh the status line every 5 seconds
set -g status-interval 5
# Status bar colors
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
# Left side: session name
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
# Room for the left part
set -g status-left-length 30
# Right side: host and time
set -g status-right "#[fg=#565f89]#H #[fg=#a9b1d6]%H:%M "
# Inactive window label
set -g window-status-format " #I:#W "
# Active window label (highlighted)
set -g window-status-current-format "#[bg=#292e42,fg=#7dcfff,bold] #I:#W "
# Pane border color
set -g pane-border-style "fg=#292e42"
# Active pane border color
set -g pane-active-border-style "fg=#7aa2f7"
# Copy-mode selection and message colors
set -g mode-style "bg=#33467c,fg=#c0caf5"
set -g message-style "bg=#1a1b26,fg=#7dcfff"

# --- Plugins (TPM: install with prefix + I) ---
# Where TPM keeps plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
# Plugin manager itself
set -g @plugin "tmux-plugins/tpm"
# Ctrl-h/j/k/l move between tmux panes and nvim splits
set -g @plugin "christoomey/vim-tmux-navigator"
# Save/restore sessions (prefix + Ctrl-s / Ctrl-r)
set -g @plugin "tmux-plugins/tmux-resurrect"
# Restore pane contents too
set -g @resurrect-capture-pane-contents "on"
# Optional: auto-save and auto-restore with tmux-continuum (uncomment both lines)
# set -g @plugin "tmux-plugins/tmux-continuum"
# set -g @continuum-restore "on"

# Initialize TPM (keep this at the very bottom)
run "~/.config/tmux/plugins/tpm/tpm"
