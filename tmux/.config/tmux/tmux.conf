# ~/.config/tmux/tmux.conf (tmux >= 3.5, installed by mise; extended-keys-format needs 3.5). Comments explain why, not what.

# --- Prefix: Ctrl+Space ---
unbind C-b
set -g prefix C-Space
# Pressing prefix twice sends Ctrl-Space to the app inside (e.g. for nested tmux)
bind -N "send Ctrl+Space to the program inside (nested tmux)" C-Space send-prefix

# --- Terminal and colors ---
set -g default-terminal "tmux-256color"
# Advertise true color (RGB) for any outer terminal
set -as terminal-features ",*:RGB"
# Forward modified keys (Shift+Enter, Ctrl+Enter) to apps that ask for them
set -s extended-keys on
# Encode them as CSI u, the format Claude Code and most apps parse
set -s extended-keys-format csi-u
# Outer terminal supports extended keys (matches xterm-256color and xterm-ghostty)
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
# Almost no delay after Esc (important for vim)
set -sg escape-time 10
# Passthrough lets the theme script recolor the outer terminal and
# image viewers such as chafa draw images from inside tmux
set -g allow-passthrough on

# --- General behavior ---
set -g mouse on
set -g history-limit 50000
# Windows start at 1 (matches the keyboard row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Closing a session switches the client to another one instead of exiting tmux
set -g detach-on-destroy off
set -g display-time 1500
set -g mode-keys vi
set -g status-keys vi

# --- Clipboard (OSC 52: also works over SSH) ---
set -g set-clipboard on

# --- Copy mode (vi style) ---
bind -N "start a selection" -T copy-mode-vi v send -X begin-selection
bind -N "copy the selection and leave copy mode" -T copy-mode-vi y send -X copy-selection-and-cancel
bind -N "toggle rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle

# --- Splits and windows (open in the current directory) ---
bind -N "split left/right in the current folder" | split-window -h -c "#{pane_current_path}"
bind -N "split top/bottom in the current folder" - split-window -v -c "#{pane_current_path}"
# Free the default split keys
unbind '"'
unbind %
bind -N "new window in the current folder" c new-window -c "#{pane_current_path}"

# --- Resize panes (repeatable: hold the key after the prefix) ---
bind -N "resize pane left by 5 cells (repeatable)" -r H resize-pane -L 5
bind -N "resize pane down by 5 cells (repeatable)" -r J resize-pane -D 5
bind -N "resize pane up by 5 cells (repeatable)" -r K resize-pane -U 5
bind -N "resize pane right by 5 cells (repeatable)" -r L resize-pane -R 5

# --- Misc bindings ---
bind -N "kill the current session (asks first)" X confirm-before -p "kill session #S? (y/n)" kill-session
bind -N "reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind -N "project session picker" f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"
# The quotes keep the tty path as one argument
bind -N "toggle light/dark theme" t run-shell "~/.local/bin/theme toggle --tty '#{client_tty}'"
bind -N "search all shortcuts (this help)" ? display-popup -E -w 80% -h 80% -T " help " "~/.local/bin/dotfiles-help"
# prefix + k shows tmux's own key list (the old prefix + ?); k is free in the defaults
bind -N "raw tmux key list" k list-keys -N

# --- Popups (see bin/.local/bin/tmux-popup) ---
# A folder that only holds repos, such as a feature folder of worktrees, asks which repo first (see bin/.local/bin/tmux-lazygit)
bind -N "lazygit popup in the pane's folder" G if-shell "command -v lazygit >/dev/null 2>&1" {
  display-popup -E -w 90% -h 90% "~/.local/bin/tmux-lazygit #{q:pane_current_path}"
} {
  display-message "lazygit is not installed"
}
# A folder of repos opens each one; the script's error message is shown when it fails (see bin/.local/bin/review)
bind -N "review changes in nvim diffview, one window per repo" R run-shell "if [ -x ~/.local/bin/review ]; then ~/.local/bin/review #{q:pane_current_path} 2>&1 >/dev/null | tail -1 | xargs -I{} tmux display-message -- {}; else tmux display-message 'review: not installed (run install.sh)'; fi"
# prefix + ` toggles a persistent scratch shell (hidden session per parent session); inside any popup it closes it
bind -N "toggle the scratch shell popup" ` if-shell -F "#{m:_popup_*,#{session_name}}" detach-client {
  run-shell "~/.local/bin/tmux-popup open shell #{q:client_name} #{q:session_id} #{q:pane_current_path}"
}
bind -N "toggle the Claude Code popup" A if-shell -F "#{m:_popup_*,#{session_name}}" detach-client {
  run-shell "~/.local/bin/tmux-popup open claude #{q:client_name} #{q:session_id} #{q:pane_current_path}"
}
bind -N "pick a session, sorted by name (popup sessions hidden)" s choose-tree -Zs -O name -f "#{?#{m:_popup_*,#{session_name}},0,1}"
# prefix + ( / ) step through sessions without stopping on the hidden popup ones (the defaults would land in them)
bind -N "previous session (skips popup sessions)" ( run-shell "~/.local/bin/tmux-popup prev #{q:client_name}"
bind -N "next session (skips popup sessions)" ) run-shell "~/.local/bin/tmux-popup next #{q:client_name}"
set-hook -g session-closed 'run-shell "~/.local/bin/tmux-popup cleanup"'
# detach-on-destroy off may move a client into a popup session: send it to the next normal one instead
set-hook -g client-session-changed {
  if-shell -F "#{m:_popup_*,#{session_name}}" {
    run-shell "~/.local/bin/tmux-popup rescue #{q:client_name}"
  }
}
# --- Status line (hand-written, minimal; palette names so it follows the theme) ---
set -g status-interval 5
# Status bar colors: the terminal's own background and foreground, readable in light and dark themes
set -g status-style "bg=default,fg=default"
# Host label for the SSH badge: $HOST_LABEL from the environment that starts the server (empty if unset);
# local.conf can override it with its own @host_label (see below)
set -g @host_label "$HOST_LABEL"
# Session block, shared by the local and SSH status-left (expanded with #{E:@session_block}): blue, yellow while the prefix is pressed
set -g @session_block "#{?client_prefix,#[fg=yellow],#[fg=blue]}#[bold,reverse] #S #[default] "
# User block: the user running the tmux server, in a purple reverse block (same purple as the starship prompt)
set -g @user_block "#[fg=magenta,bold,reverse] #{user} #[default]"
# Left side: the user block, then the session block (reverse gives a block with the terminal background as text)
set -g status-left "#{E:@user_block}#{E:@session_block}"
set -g status-left-length 80
# Right side: git branch of the current pane (empty outside a repo), host and time in the default foreground (brightblack is too faint on a light background)
set -g status-right '#(cd #{q:pane_current_path} 2>/dev/null && b=$(git branch --show-current 2>/dev/null) && [ -n "$b" ] && echo "  $b ")#h #[bold]%H:%M '
set -g status-right-length 80
# On a remote machine (server started from an SSH session) use another look so it never passes for the local tmux:
# a red SSH badge with user@host (host: @host_label from $HOST_LABEL, or the short hostname when empty), then the same session block as locally.
# No hostname on the right.
# if-shell runs in the server's environment, so it sees the SSH_CONNECTION of the shell that started the server;
# a server first started locally and reached over SSH later keeps the local look.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g status-left "#[fg=red,bold,reverse] 󰣀 SSH #{user}@#{?@host_label,#{@host_label},#{host_short}} #[default]#{E:@session_block}"
  set -g status-right '#(cd #{q:pane_current_path} 2>/dev/null && b=$(git branch --show-current 2>/dev/null) && [ -n "$b" ] && echo "  $b ")#[bold]%H:%M '
}
# Flag bells from windows you are not looking at (Claude Code rings one when it needs you)
set -g monitor-bell on
set -g bell-action any
# No visual-bell message: the window label shows the bell instead
set -g visual-bell off
# Window with a bell: yellow reverse block, visible on any palette (activity monitoring stays off: too noisy)
set -g window-status-bell-style "fg=yellow,bold,reverse"
# Narrower clients show only the first letter of the account name
set -g @claude_label_min_width 120
# One magenta dot per pane that sets @claude_account, then the account name; spaces (not commas) in style changes so they fit the conditional
set -g @claude_window_label "#{P:#{?#{@claude_account}, #[fg=magenta]●#{?#{e|<:#{client_width},#{@claude_label_min_width}},#{=1:@claude_account},#{@claude_account}}#[fg=default],}}"
# Inactive window label (no dim: unreadable on some palettes); bell and zoom markers
set -g window-status-format " #I:#W#{?window_bell_flag, 🔔,}#{?window_zoomed_flag, 🔍,}#{E:@claude_window_label} "
# Active window label: reverse flips default fg/bg, so it contrasts with the bar in any theme
set -g window-status-current-format "#[fg=default,bold,reverse] #I:#W#{?window_zoomed_flag, 🔍,} "
# Name windows after the running command; a version-like name (2.1.312) is Claude Code
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^[0-9]+\\.[0-9]+,#{pane_current_command}},claude,#{pane_current_command}}"
# Heavy lines (thick) so the pane divider stands apart from lines drawn by apps
set -g pane-border-lines heavy
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
# Mark the active pane with arrows: the default colors only half of a shared border
set -g pane-border-indicators arrows
# Pane label: index and command (a version-like command is Claude Code), then the Claude account in magenta when @claude_account is set
set -g pane-border-format "#{?pane_active,#[fg=blue#,bold#,reverse],#[fg=default]} #{pane_index}: #{?#{m/r:^[0-9]+\\.[0-9]+,#{pane_current_command}},claude,#{pane_current_command}} #[default]#{?#{@claude_account}, #[fg=magenta]●#{@claude_account}#[default],}"
# Show the label row only in windows with 2+ panes; this hook runs on split, close, layout change and session restore
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "set -w pane-border-status top" "set -w pane-border-status off"'
# Copy-mode selection colors: reverse is visible on any palette
set -g mode-style "reverse"
# Message and prompt line: blue block like the session name; fill=blue paints the rest of the line so no status text shows through
set -g message-style "bg=default,fg=blue,bold,reverse,fill=blue"
set -g message-command-style "bg=default,fg=blue,bold,reverse,fill=blue"
# Popups: tmux 3.8 defaults to a solid grey (bg=themedarkgrey), unreadable on light themes; use the terminal colors
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=blue"
set -g popup-border-lines rounded

# --- Pane navigation with Ctrl-h/j/k/l (same bindings as vim-tmux-navigator; the nvim side of that plugin pairs with them) ---
# True when the pane's foreground process is vim, nvim, view, fzf or similar: those get the key instead of tmux
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
# Ctrl-h/j/k/l move between tmux panes without the prefix, or pass through to vim/nvim
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# Ctrl-\ jumps to the previously active pane
bind -n "C-\\" if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"
# The same keys move between panes in copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi "C-\\" select-pane -l
# prefix + Ctrl-l clears the screen and the scrollback (plain Ctrl-l is the pane move above; Cmd-K sends this)
# In vim/nvim it does nothing: Ctrl-l would reach the editor, where the navigator turns it into a move to the right
# The clear runs 0.3s later: the shell's redraw pushes the old screen into history, so clearing at once leaves 30 lines
bind -N "clear the screen and the scrollback (does nothing in vim/nvim)" C-l if -F "#{m/r:^(n?vim|vi)$,#{pane_current_command}}" "" {
  send-keys C-l
  run-shell -d 0.3 "tmux clear-history -t '#{pane_id}'"
}

# --- Per-machine overrides ---
# Untracked local file (not stowed), e.g. set -g @host_label "dev-box"; after the status settings and before TPM so it can override them
source-file -q ~/.config/tmux/local.conf

# --- Plugins (TPM: install with prefix + I) ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
# Save/restore sessions (prefix + Ctrl-s / Ctrl-r)
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @resurrect-capture-pane-contents "on"
# Re-run ssh in restored panes; a plain name restores the full saved command (ssh host)
set -g @resurrect-processes "ssh"
# Keep last in the plugin list: it prepends to status-right
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"
# Popup sessions come back from a save without their parent mark: kill them after every restore
set -g @resurrect-hook-post-restore-all "~/.local/bin/tmux-popup cleanup"
set -g @continuum-save-interval "15"

# Initialize TPM in the background (-b): the plugins take seconds to load and would block the server; keep this last, except for bindings that must override plugin keys: they go after it
run -b "~/.config/tmux/plugins/tpm/tpm"

# The folder list holds this pane's path, zoxide's folders and the tmux-sessionizer projects; typing a path that is not in the list works too
# The name goes through an option (a quote in an answer would be an error); the script reads and cleans it
bind -N "new session by name, folder picked with fzf" N command-prompt -p "session name:" "set -g @new_session_name \"%1\" ; display-popup -E -w 80% -h 60% -T ' folder for #{@new_session_name} ' \"~/.local/bin/tmux-new-session '#{pane_current_path}'\""
