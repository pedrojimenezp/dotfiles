# Icons are \uXXXX escapes so editors cannot strip them.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500  # ms; slower modules are skipped

format = """
[╭─ ](dimmed)$os$username${env_var.PROMPT_HOST} in $directory$git_branch$git_status$golang$nodejs$zig$python$cmd_duration$fill$status$time
[╰─](dimmed)$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold cyan"

[os.symbols]
Macos = "\uf179 "
Ubuntu = "\uf31b "
Linux = "\uf17c "

[fill]
symbol = "·"
style = "dimmed"  # bright-black is too faint on light themes

[status]
disabled = false
success_symbol = "✔"
symbol = "✘ $status"
format = "[$symbol]($style) "
success_style = "green"
failure_style = "bold red"
style = "bold red"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "at [$time]($style)"
style = "dimmed"

[username]
show_always = true  # locally too, not only over SSH or as root
format = "[$user]($style)"
style_user = "bold purple"
style_root = "bold red"

[env_var.PROMPT_HOST]
variable = "PROMPT_HOST"  # exported by .zshrc over SSH only
format = "[@$env_value]($style)"
style = "bold purple"

[directory]
truncation_length = 3
truncate_to_repo = true  # relative to the git repo root

[git_branch]
symbol = "\ue0a0 "
format = "on [$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[golang]
symbol = "\ue627 "
[nodejs]
symbol = "\ue718 "
[zig]
symbol = "\ue6a9 "
[python]
symbol = "\ue73c "
